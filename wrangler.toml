name = "hers"
compatibility_date = "2024-09-23"

# Site 100% statique (aucun code de Worker) : on sert directement le résultat du build Vite.
# "single-page-application" renvoie index.html pour toute URL inconnue, au cas où l'appli
# utiliserait un jour la navigation par URL (utile aussi pour un rechargement de page fiable).
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
